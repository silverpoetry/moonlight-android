pluginManagement {
    includeBuild 'build-logic'
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'moonlight-android'

include ':app'
include ':core'
include ':core:hosts'
include ':core:settings'
include ':core:transfer'
include ':core:virtual-controls'
include ':core:shield-controller-extensions'
