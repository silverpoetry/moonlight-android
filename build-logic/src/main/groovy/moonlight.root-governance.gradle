import com.moonlight.buildlogic.VerifyAndroidSecurityPolicy
import com.moonlight.buildlogic.VerifyForbiddenFiles
import com.moonlight.buildlogic.VerifyJavaSuppressionPolicy
import com.moonlight.buildlogic.VerifyNoBidiControls
import com.moonlight.buildlogic.VerifyNativeDependencies
import com.moonlight.buildlogic.VerifyNoLegacyBranding
import com.moonlight.buildlogic.VerifyProductionLoggingPolicy
import com.moonlight.buildlogic.VerifyVendoredDependencies

tasks.register('verifyNoBidiControls', VerifyNoBidiControls) {
    group = 'verification'
    description = 'Rejects deceptive bidirectional Unicode controls in source files.'
    sourceFiles.from(fileTree(rootDir) {
        include '**/*.java',
                '**/*.kt',
                '**/*.groovy',
                '**/*.gradle',
                '**/*.toml',
                '**/*.c',
                '**/*.cc',
                '**/*.cpp',
                '**/*.h',
                '**/*.hpp',
                '**/*.mk',
                '**/CMakeLists.txt',
                'gradle.properties'
        exclude '**/.gradle/**', '**/build/**', '**/.git/**'
    })
}

tasks.register('verifyNoLegacyBranding', VerifyNoLegacyBranding) {
    group = 'verification'
    description = 'Rejects removed fork branding and resource prefixes.'
    sourceFiles.from(fileTree(rootDir) {
        include 'app/src/main/**', 'tools/**'
        exclude 'app/src/main/jni/moonlight-core/**',
                '**/.gradle/**',
                '**/build/**',
                '**/.git/**'
    })
}

tasks.register('verifyProductionLoggingPolicy',
        VerifyProductionLoggingPolicy) {
    group = 'verification'
    description = 'Rejects production logging that bypasses debug gating.'
    sourceFiles.from(
            fileTree('app/src/main/java') {
                include '**/*.java'
            },
            fileTree('app/src/root/java') {
                include '**/*.java'
            },
            fileTree('core/shield-controller-extensions/src/main/java') {
                include '**/*.java'
            },
            fileTree('app/src/main/jni') {
                include '**/*.c', '**/*.cc', '**/*.cpp', '**/*.h', '**/*.hpp'
                exclude 'moonlight-core/moonlight-common-c/**',
                        'moonlight-core/openssl/**',
                        'moonlight-core/libopus/**'
            })
}

tasks.register('verifyJavaSuppressionPolicy',
        VerifyJavaSuppressionPolicy) {
    group = 'verification'
    description = 'Rejects broad or stale Java warning suppressions.'
    sourceFiles.from(
            fileTree('app/src/main/java') {
                include '**/*.java'
            },
            fileTree('app/src/root/java') {
                include '**/*.java'
            },
            fileTree('core') {
                include '*/src/main/java/**/*.java'
            })
}

tasks.register('verifyAndroidSecurityPolicy', VerifyAndroidSecurityPolicy) {
    group = 'verification'
    description = 'Locks reviewed Android sharing, backup, component, and trust boundaries.'
    manifestFile.set(layout.projectDirectory.file('app/src/main/AndroidManifest.xml'))
    fileProviderPathsFile.set(layout.projectDirectory.file(
            'app/src/main/res/xml/provider_file_paths.xml'))
    legacyBackupRulesFile.set(layout.projectDirectory.file(
            'app/src/main/res/xml/backup_rules.xml'))
    modernBackupRulesFile.set(layout.projectDirectory.file(
            'app/src/main/res/xml/backup_rules_s.xml'))
    networkSecurityConfigFile.set(layout.projectDirectory.file(
            'app/src/main/res/xml/network_security_config.xml'))
}

tasks.register('verifyNoRepositorySecrets', VerifyForbiddenFiles) {
    group = 'verification'
    description = 'Rejects repository-local signing material and exported client credentials.'
    forbiddenFiles.from(fileTree(rootDir) {
        include '**/*.jks',
                '**/*.keystore',
                '**/*.p12',
                '**/*.pfx',
                '**/*.pem',
                '**/*.key',
                '**/signing.properties',
                '**/client.crt'
        exclude '**/.gradle/**', '**/build/**', '**/.git/**'
    })
}

tasks.register('verifyNativeDependencies', VerifyNativeDependencies) {
    group = 'verification'
    description = 'Verifies checked-in native dependency provenance and content.'
    manifestFile.set(layout.projectDirectory.file(
            'gradle/native-dependencies.json'))
    repositoryDirectory.set(layout.projectDirectory)
    dependencyFiles.from(
            fileTree('app/src/main/jni/moonlight-core/openssl'),
            fileTree('app/src/main/jni/moonlight-core/libopus'),
            fileTree('app/src/main/assets/third_party_licenses'),
            fileTree('app/libs'))
}

tasks.register('verifyVendoredDependencies', VerifyVendoredDependencies) {
    group = 'verification'
    description = 'Verifies source, license, and content of vendored dependencies.'
    manifestFile.set(layout.projectDirectory.file(
            'gradle/vendored-dependencies.json'))
    repositoryDirectory.set(layout.projectDirectory)
    dependencyFiles.from(fileTree('core/shield-controller-extensions') {
        exclude 'build/**'
    }, fileTree('app/src/main/assets/third_party_licenses'))
}
