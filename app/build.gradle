import com.android.build.api.artifact.SingleArtifact
import com.moonlight.buildlogic.VerifyReleaseManifestPolicy

plugins {
    alias(libs.plugins.android.application)
}

android {
    ndkVersion = "27.0.12077973"

    compileSdk = 37

    namespace = 'com.limelight'

    defaultConfig {
        minSdk = 21
        targetSdk = 37
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        versionName = "12.1-260803"
        versionCode = 315
        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'
    }

    flavorDimensions.add("root")

    buildFeatures {
        buildConfig = true
        resValues = true
    }

    productFlavors {
        root {
            // Android O has native mouse capture, so don't show the rooted
            // version to devices running O on the Play Store.
            maxSdk = 25

            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=root"
                }
            }

            applicationId = "com.moonlight.android.root"
            dimension = "root"
            buildConfigField "boolean", "ROOT_BUILD", "true"
        }

        nonRoot {
            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=nonRoot"
                }
            }

            applicationId = "com.moonlight.android"
            dimension = "root"
            buildConfigField "boolean", "ROOT_BUILD", "false"
        }
    }

    compileOptions {
        encoding = "UTF-8"
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    lint {
        // AGP 9.3's BidiSpoofing detector calls the JDK 21 List.removeLast()
        // API while AGP officially runs on JDK 17. The root build replaces
        // only that crashing detector with the mandatory verifyNoBidiControls
        // source scan; all other lint checks remain warnings-as-errors.
        disable 'MissingTranslation', 'BidiSpoofing'
        lintConfig = file('lint.xml')
        abortOnError = true
        warningsAsErrors = true
    }

    packaging {
        resources {
            // The three BC Android runtime artifacts contain the same Java 9 OSGi
            // descriptor. It is not used on Android and cannot be merged into one APK.
            excludes += 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
            // Bouncy Castle publishes the same top-level license in each split
            // runtime artifact. It is distribution metadata, not an app resource.
            excludes += 'META-INF/LICENSE.md'
        }
    }

    // Keep every locale in the base module because the app provides its own
    // runtime language switcher. The finalized DSL invariant below prevents
    // any variant or later configuration block from re-enabling the split.
    bundle.language.enableSplit = false

    buildTypes {
        debug {
            applicationIdSuffix = ".debug"
            resValue "string", "app_label", "Moonlight (Debug)"
            resValue "string", "app_label_root", "Moonlight (Root Debug)"

            minifyEnabled = false
        }
        release {
            // Preserve upgrade compatibility with installed predecessor
            // builds signed by this workspace's long-lived keystore.
            signingConfig = signingConfigs.debug

            resValue "string", "app_label", "Moonlight"
            resValue "string", "app_label_root", "Moonlight (Root)"

            minifyEnabled = false
        }
    }

    externalNativeBuild {
        ndkBuild {
            path = file("src/main/jni/Android.mk")
        }
    }

}

androidComponents {
    finalizeDsl { extension ->
        if (extension.bundle.language.enableSplit) {
            throw new GradleException(
                    'Runtime locale switching requires language splits to ' +
                            'remain disabled')
        }
    }

    // Release-only behavior such as logging suppression must be exercised
    // against the generated Release BuildConfig, not inferred from Debug.
    beforeVariants(selector().withBuildType('release')) { variantBuilder ->
        variantBuilder.enableUnitTest = true
    }

    onVariants(selector().withBuildType('release')) { variant ->
        String taskSuffix = variant.name.substring(0, 1).toUpperCase() +
                variant.name.substring(1)
        def manifestPolicyTask = tasks.register(
                "verify${taskSuffix}ManifestSecurity",
                VerifyReleaseManifestPolicy) {
            group = 'verification'
            description = "Verifies the merged ${variant.name} manifest."
            variantName.set(variant.name)
            manifestFile.set(
                    variant.artifacts.get(
                            SingleArtifact.MERGED_MANIFEST.INSTANCE))
        }
        rootProject.tasks.named('verifyAndroidSecurityPolicy').configure {
            dependsOn(manifestPolicyTask)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    // Keep compiler debt visible with actionable file and symbol names.
    options.compilerArgs += [
            '-Xlint:deprecation',
            '-Xlint:unchecked',
            '-Xmaxwarns',
            '1000'
    ]
}

dependencies {
    implementation project(':core:hosts')
    implementation project(':core:settings')
    implementation project(':core:transfer')
    implementation project(':core:virtual-controls')
    implementation project(':core:shield-controller-extensions')

    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.junit
    testImplementation libs.junit4
    testImplementation libs.archunit

    implementation libs.bundles.bouncycastle
    implementation libs.jcodec
    implementation libs.okhttp
    implementation libs.jmdns
    implementation libs.gson
    implementation libs.androidx.activity
    implementation libs.androidx.appcompat
    implementation libs.androidx.core
    implementation libs.androidx.documentfile
    implementation libs.androidx.fragment
    implementation libs.glide.runtime
    annotationProcessor libs.glide.compiler
}
