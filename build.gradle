// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.10.1'
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
        maven { url 'https://jitpack.io' }
    }
}

tasks.register('verifyLocal') {
    group = 'verification'
    description = 'Runs all JVM tests, Android Lint checks, and builds both release flavors.'
    dependsOn ':core:hosts:test',
            ':core:settings:test',
            ':core:transfer:test',
            ':core:virtual-controls:test',
            ':app:test',
            ':app:lintNonRootDebug',
            ':app:lintNonRootRelease',
            ':app:lintRootDebug',
            ':app:lintRootRelease',
            ':app:assembleNonRootRelease',
            ':app:assembleRootRelease'
}

tasks.register('verifyConnected') {
    group = 'verification'
    description = 'Runs local verification plus every instrumentation test on a connected device.'
    dependsOn verifyLocal, ':app:connectedAndroidTest'
}
