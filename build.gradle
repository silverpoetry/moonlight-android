import com.moonlight.buildlogic.GenerateApplicationSbom
import org.cyclonedx.model.Component

plugins {
    id 'moonlight.root-governance'
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.compose.compiler) apply false
    alias(libs.plugins.cyclonedx.bom)
}

allprojects {
    group = 'com.limelight'
    version = '12.1-260807'
}

// The ordinary non-root Release is the only daily build target. The complete
// root/non-root matrix remains available through verifyLocal for release gates.
defaultTasks 'nonRootRelease'

tasks.register('nonRootRelease') {
    group = 'build'
    description = 'Builds the ordinary non-root Release APK (the daily build target).'
    dependsOn ':app:assembleNonRootRelease'
}

tasks.register('verifyNonRootRelease') {
    group = 'verification'
    description = 'Runs the daily non-root Release tests, Lint, and APK build.'
    dependsOn verifyNoBidiControls,
            verifyNoLegacyBranding,
            verifyProductionLoggingPolicy,
            verifyJavaSuppressionPolicy,
            verifyAndroidSecurityPolicy,
            verifyNoRepositorySecrets,
            verifyNativeDependencies,
            verifyVendoredDependencies,
            ':core:hosts:test',
            ':core:settings:test',
            ':core:transfer:test',
            ':core:virtual-controls:test',
            ':core:shield-controller-extensions:lintRelease',
            ':app:testNonRootReleaseUnitTest',
            ':app:lintNonRootRelease',
            ':app:assembleNonRootRelease'
}

project(':app') {
    tasks.named('cyclonedxDirectBom') {
        projectType = Component.Type.APPLICATION
        componentGroup = 'com.limelight'
        componentName = 'moonlight-android'
        componentVersion = '12.1-260807'
        includeConfigs.set([
                'nonRootReleaseRuntimeClasspath',
                'rootReleaseRuntimeClasspath'
        ])
        includeBomSerialNumber = false
        includeLicenseText = true
        includeBuildSystem = false
        includeBuildEnvironment = false
        jsonOutput.set(rootProject.layout.buildDirectory.file(
                'reports/sbom/gradle-components.cdx.json'))
        xmlOutput.unsetConvention()
    }
}

tasks.register('applicationSbom', GenerateApplicationSbom) {
    group = 'documentation'
    description = 'Generates the complete application CycloneDX SBOM.'
    dependsOn ':app:cyclonedxDirectBom',
            verifyNativeDependencies,
            verifyVendoredDependencies
    gradleSbom.set(layout.buildDirectory.file(
            'reports/sbom/gradle-components.cdx.json'))
    nativeManifest.set(layout.projectDirectory.file(
            'gradle/native-dependencies.json'))
    vendoredManifest.set(layout.projectDirectory.file(
            'gradle/vendored-dependencies.json'))
    outputFile.set(layout.buildDirectory.file(
            'reports/sbom/moonlight-android.cdx.json'))
}

tasks.register('verifyLocal') {
    group = 'verification'
    description = 'Runs all JVM tests, Android Lint checks, and builds both release flavors.'
    dependsOn verifyNoBidiControls,
            verifyNoLegacyBranding,
            verifyProductionLoggingPolicy,
            verifyJavaSuppressionPolicy,
            verifyAndroidSecurityPolicy,
            verifyNoRepositorySecrets,
            verifyNativeDependencies,
            verifyVendoredDependencies,
            applicationSbom,
            ':core:hosts:test',
            ':core:settings:test',
            ':core:transfer:test',
            ':core:virtual-controls:test',
            ':core:shield-controller-extensions:lint',
            ':app:test',
            ':app:lintNonRootDebug',
            ':app:lintNonRootRelease',
            ':app:lintRootDebug',
            ':app:lintRootRelease',
            ':app:assembleNonRootRelease',
            ':app:assembleRootRelease'
}

tasks.register('verifyConnected') {
    group = 'verification'
    description = 'Runs local verification plus every instrumentation test on a connected device.'
    dependsOn verifyLocal,
            ':app:connectedAndroidTest',
            ':core:shield-controller-extensions:connectedAndroidTest'
}
